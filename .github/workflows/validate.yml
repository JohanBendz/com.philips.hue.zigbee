name: Validate app

on:
  push:
    branches: [modernize-2026, develop-2.5]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate manifest and run Homey publish validation
        run: npx --yes homey@4.5.0 app validate --level publish
      - run: npm test
      - name: Homey SDK beta types audit
        if: github.head_ref == 'audit/homey-types-beta' || github.ref == 'refs/heads/audit/homey-types-beta'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts typescript@latest @types/homey@npm:homey-apps-sdk-v3-types@beta
          npm ls @types/homey typescript || true
          npx tsc -p jsconfig.homey-beta.json --pretty false
      - name: Whitespace check
        run: git diff --check
